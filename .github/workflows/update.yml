name: Update Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

*obs:
  update:
    runs-on: ubuntu*latest

    permissions:
      con*ents: write

    steps:
      - us*s: actions/checkout@v4

      - us*s: actions/setup-python@v5
       *with:
          python-version: '3*11'

      - name: Run fetch scrip*
        run: python fetch_data.py*
      - name: Push updates
      * run: |
          git config user.*ame "Auto Update"
          git co*fig user.email "bot@github.com"
  *       git add data.json
          git commit -m "Auto update" || exit 0
          git push
