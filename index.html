<title>الدوري السعودي - إحصائيات</title>
<style>

  h1 { text-align: center; margin-bottom: 25px; color: #1a5490; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); flex-wrap: wrap; }
  .tab { flex: 1; min-width: 100px; padding: 12px; border: none; background: transparent; cursor: pointer; font-size: 15px; font-weight: bold; color: #555; border-radius: 8px; font-family: inherit; }
  .tab:hover { background: #f0f2f5; }
  .tab.active { background: #1a5490; color: white; }
  .tab.active-live { background: #c0392b; color: white; }
  .content { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #1a5490; color: white; padding: 12px; text-align: center; font-size: 14px; }
  td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
  .team { text-align: right; font-weight: bold; }
  tr:hover { background: #f8f9fa; }
  tr.live-team { background: #fff5f5; }
  .loading { text-align: center; color: #1a5490; padding: 40px; }
  .empty { text-align: center; color: #888; padding: 40px; font-size: 16px; }
  .search-bar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
  .search-bar input, .search-bar select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; flex: 1; min-width: 150px; }
  .match-filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn { padding: 10px 16px; border: 2px solid #e0e0e0; background: white; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: bold; color: #555; font-family: inherit; }
  .filter-btn.active { background: #1a5490; color: white; border-color: #1a5490; }
  .filter-btn .count { display: inline-block; background: rgba(255,255,255,0.25); padding: 1px 8px; border-radius: 10px; margin-right: 5px; font-size: 12px; }
  .filter-btn:not(.active) .count { background: #f0f2f5; color: #666; }
  .match-card { border: 1px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 12px; }
  .match-card.live { border-color: #c0392b; border-width: 2px; }
  .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: #666; }
  .match-status { background: #e8f4fd; color: #1a5490; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
  .match-status.live { background: #fee; color: #c0392b; }
  .match-status.finished { background: #e8f8e8; color: #27ae60; }
  .match-status.kicked-off { background: #fff4e0; color: #e67e22; }
  .match-body { display: flex; justify-content: space-between; align-items: center; }
  .match-team { flex: 1; font-weight: bold; font-size: 16px; text-align: center; }
  .match-center { margin: 0 20px; min-width: 180px; text-align: center; }
  .match-score { background: #1a5490; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 20px; }
  .match-score.live-score { background: #c0392b; }
  .countdown { display: flex; justify-content: center; gap: 6px; direction: ltr; }
  .cd-box { background: linear-gradient(135deg, #1a5490, #2c6db5); color: white; padding: 8px 10px; border-radius: 8px; min-width: 50px; text-align: center; }
  .cd-num { font-size: 20px; font-weight: bold; line-height: 1; }
  .cd-label { font-size: 10px; opacity: 0.85; margin-top: 3px; }
  .cd-sep { color: #1a5490; font-size: 20px; font-weight: bold; align-self: center; padding: 0 2px; }
  .updated { text-align: center; color: #888; font-size: 12px; margin-top: 15px; }

  .pos-badge.GK { background: #fff4e0; color: #b8860b; }
  .pos-badge.DF { background: #e8f8e8; color: #27ae60; }
  .pos-badge.MF { background: #e8f4fd; color: #1a5490; }

  .rank-badge { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; background: #e8f4fd; color: #1a5490; font-weight: bold; text-align: center; font-size: 13px; }
  .rank-badge.gold { background: #ffd700; color: #333; }

<div class="tabs">

  <button class="tab" onclick="showTab('live', this)" id="tabLive" style="display:none;">🔴 ترتيب حي</button>

</div>

<div id="results" class="content hidden">

</div>

function translateName(name) {
  if (!name) return '';
  var lower = name.toLowerCase();
  if (nameMap[lower]) return nameMap[lower];
  return name.split(' ').map(function(word) {
    var clean = word.toLowerCase().replace(/[^a-z'-]/g, '');
    if (!clean) return word;
    if (nameMap[clean]) return nameMap[clean];
    if (clean.indexOf('al-') === 0) {
      var r = clean.substring(3);
      if (nameMap['al-' + r]) return nameMap['al-' + r];
      if (nameMap[r]) return 'ال' + nameMap[r];
    }
    if (clean.indexOf('el-') === 0) { var r2 = clean.substring(3); if (nameMap[r2]) return 'ال' + nameMap[r2]; }
    if (clean.indexOf('al') === 0 && clean.length > 4) { var r3 = clean.substring(2); if (nameMap[r3]) return 'ال' + nameMap[r3]; }
    if (clean.indexOf('ben-') === 0 || clean.indexOf('bin-') === 0) { var r4 = clean.substring(4); if (nameMap[r4]) return 'بن ' + nameMap[r4]; }
    var m = clean.match(/^(abdel|abdul|abd|abed)(.+)$/);
    if (m && nameMap[m[2]]) return 'عبدال' + nameMap[m[2]];
    return word;
  }).join(' ');
}
function translateCountry(c) {
  if (!c) return '—';
  if (countryMap[c]) return countryMap[c];
  for (var k in countryMap) if (k.toLowerCase() === c.toLowerCase()) return countryMap[k];
  return c;
}
function showTab(id, btn) {
  document.querySelectorAll('.content').forEach(function(el) { el.classList.add('hidden'); });
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active', 'active-live'); });
  document.getElementById(id).classList.remove('hidden');
  if (id === 'live') btn.classList.add('active-live'); else btn.classList.add('active');
}
function formatMatchDate(iso) {
  var d = new Date(iso);
  var days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return days[d.getDay()] + '، ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function formatMatchTime(iso) {
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'مساءً' : 'صباحاً';
  h = h % 12; if (h === 0) h = 12;
  var mm = m < 10 ? '0' + m : m;
  return h + ':' + mm + ' ' + ampm;
}
function posName(a) {
  if (a === 'GK' || a === 'G') return 'GK';
  if (['DF','D','CB','LB','RB'].indexOf(a) !== -1) return 'DF';
  if (['MF','M','CM','DM','AM'].indexOf(a) !== -1) return 'MF';
  if (['FW','F','ST','CF','LW','RW'].indexOf(a) !== -1) return 'FW';
  return a;
}
function posArabic(a) {
  var p = posName(a);
  return p === 'GK' ? 'حارس' : p === 'DF' ? 'مدافع' : p === 'MF' ? 'وسط' : p === 'FW' ? 'مهاجم' : (a || '—');
}

/* ============ حالة المباراة (محسّنة جداً) ============
   القواعد:
   1. إذا ESPN قالت "completed" → منتهية.
   2. إذا ESPN قالت "in progress" → مباشرة (نثق بها، حتى لو مرت ساعات - بسبب الوقت الإضافي).
   3. إذا ESPN قالت "half time" → بين الشوطين.
   4. إذا ESPN قالت "scheduled" (لم تبدأ): نعتمد على الوقت:
      - قبل وقت البدء → قادمة.
      - من وقت البدء إلى 105 دقيقة → مباشرة تقديرية.
      - من 105 إلى 135 دقيقة → قد تكون بين الشوطين أو أوشكت.
      - أكثر من 135 دقيقة → منتهية تقديرياً.
*/
function getMatchState(m) {
  var status = (m.status || '').toLowerCase();
  var state = (m.state || '').toLowerCase();
  var matchTime = new Date(m.date).getTime();
  var diffMin = (Date.now() - matchTime) / 60000;

  // 1. انتهت رسمياً
  if (m.completed || state === 'post' || status === 'ft' || status.indexOf('final') !== -1 || status.indexOf('full time') !== -1) {
    return 'finished';
  }

  // 2. بين الشوطين رسمياً
  if (status === 'ht' || status.indexOf('half time') !== -1 || status.indexOf('halftime') !== -1) {
    return 'halftime';
  }

  // 3. مباشرة رسمياً - ESPN تعرف أفضل (بما فيها الوقت الإضافي)
  if (state === 'in' || status.indexOf('progress') !== -1 || /^\d+'/.test(status) || status.indexOf("'") !== -1) {
    return 'live';
  }

  // 4. الحكم على الوقت (عندما لا تكون ESPN محدثة)
  if (diffMin < 0) return 'upcoming';
  if (diffMin < 105) return 'live-auto';           // تقديري: مباشر
  if (diffMin >= 105 && diffMin < 135) return 'halftime'; // تقديري: بين الشوطين/إضافي
  return 'finished';                                // تقديري: انتهت
}

function getDateCategory(dateIso) {
  var d = new Date(dateIso);
  var today = new Date(); today.setHours(0,0,0,0);
  var tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  var dayAfter = new Date(today); dayAfter.setDate(today.getDate() + 2);
  var yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  var weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
  var weekAhead = new Date(today); weekAhead.setDate(today.getDate() + 7);
  if (d >= today && d < tomorrow) return 'today';
  if (d >= tomorrow && d < dayAfter) return 'tomorrow';
  if (d >= yesterday && d < today) return 'yesterday';
  if (d >= weekAgo && d < yesterday) return 'lastweek';
  if (d >= dayAfter && d < weekAhead) return 'nextweek';
  return 'other';
}

function isLiveState(state) {
  return state === 'live' || state === 'live-auto' || state === 'halftime';
}

function getFilteredMatches(filter) {
  return allMatches.filter(function(m) {
    var state = getMatchState(m);
    var cat = getDateCategory(m.date);
    if (filter === 'all') return true;
    if (filter === 'live') return isLiveState(state);
    if (filter === 'today') return cat === 'today';
    if (filter === 'tomorrow') return cat === 'tomorrow';
    if (filter === 'yesterday') return cat === 'yesterday';
    if (filter === 'lastweek') return cat === 'lastweek';
    if (filter === 'nextweek') return cat === 'nextweek';
    return true;
  }).sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
}

function computeLiveStandings() {
  var table = originalStandings.map(function(t) {
    return { t: t.t, p: parseInt(t.p)||0, w: parseInt(t.w)||0, d: parseInt(t.d)||0,
             l: parseInt(t.l)||0, gf: parseInt(t.gf)||0, ga: parseInt(t.ga)||0,
             pts: parseInt(t.pts)||0, live: false };
  });
  var liveMatches = [];
  allMatches.forEach(function(m) {
    if (isLiveState(getMatchState(m))) {
      liveMatches.push(m);
      var hs = parseInt(m.hs) || 0, as = parseInt(m.as) || 0;
      var home = table.find(function(t) { return t.t === m.home; });
      var away = table.find(function(t) { return t.t === m.away; });
      if (home && away) {
        home.live = true; away.live = true;
        home.p++; away.p++;
        home.gf += hs; home.ga += as;
        away.gf += as; away.ga += hs;
        if (hs > as) { home.w++; home.pts += 3; away.l++; }
        else if (as > hs) { away.w++; away.pts += 3; home.l++; }
        else { home.d++; home.pts++; away.d++; away.pts++; }
      }
    }
  });
  table.sort(function(a, b) {
    if (b.pts !== a.pts) return b.pts - a.pts;
    var gdA = a.gf - a.ga, gdB = b.gf - b.ga;
    if (gdB !== gdA) return gdB - gdA;
    return b.gf - a.gf;
  });
  table.forEach(function(t, i) { t.r = i + 1; });
  return { table: table, liveMatches: liveMatches };
}

function renderLiveStandings() {
  var result = computeLiveStandings();
  var table = result.table;
  var liveMatches = result.liveMatches;
  var info = document.getElementById('liveMatchesInfo');
  if (liveMatches.length === 0) {
    info.innerHTML = 'لا توجد مباريات جارية حالياً.';
  } else {
    var mhtml = '<b>' + liveMatches.length + ' مباراة جارية الآن:</b><br>';
    liveMatches.forEach(function(m) {
      mhtml += '⚽ ' + m.home + ' <b>' + m.hs + ' - ' + m.as + '</b> ' + m.away + '<br>';
    });
    info.innerHTML = mhtml;
  }
  var html = '';
  table.forEach(function(t) {
    var prev = previousRanks[t.t];
    var changeHtml = '';
    if (prev !== undefined && prev !== t.r) {
      var diff = prev - t.r;
      if (diff > 0) changeHtml = '<span class="change-arrow change-up">▲</span>';
      else changeHtml = '<span class="change-arrow change-down">▼</span>';
    }
    var rowClass = t.live ? 'live-team' : '';
    var rankClass = 'rank-badge';
    if (t.r === 1) rankClass += ' gold';
    else if (t.r === 2) rankClass += ' silver';
    else if (t.r === 3) rankClass += ' bronze';
    var gd = t.gf - t.ga;
    var gdStr = (gd > 0 ? '+' : '') + gd;
    html += '<tr class="' + rowClass + '">';
    html += '<td><span class="' + rankClass + '">' + t.r + '</span>' + changeHtml + '</td>';
    html += '<td class="team">' + t.t + (t.live ? ' ⚽' : '') + '</td>';
    html += '<td>' + t.p + '</td><td>' + t.w + '</td><td>' + t.d + '</td><td>' + t.l + '</td>';
    html += '<td>' + t.gf + '</td><td>' + t.ga + '</td><td>' + gdStr + '</td>';
    html += '<td><b>' + t.pts + '</b></td></tr>';
  });
  document.getElementById('liveBody').innerHTML = html;
  previousRanks = {};
  table.forEach(function(t) { previousRanks[t.t] = t.r; });
}

function buildFilters() {
  var filters = [
    { id: 'all', label: '📋 الكل' },
    { id: 'live', label: '🔴 مباشر الآن' },
    { id: 'today', label: '📅 اليوم' },
    { id: 'yesterday', label: '⬅️ أمس' },
    { id: 'tomorrow', label: '➡️ غداً' },
    { id: 'lastweek', label: '⏪ الأسبوع الماضي' },
    { id: 'nextweek', label: '⏩ الأسبوع القادم' }
  ];
  var html = '';
  filters.forEach(function(f) {
    var count = getFilteredMatches(f.id).length;
    var activeClass = currentFilter === f.id ? 'active' : '';
    html += '<button class="filter-btn ' + activeClass + '" onclick="setFilter(\'' + f.id + '\')">' + f.label + ' <span class="count">' + count + '</span></button>';
  });
  document.getElementById('matchFilters').innerHTML = html;
}
function setFilter(f) { currentFilter = f; buildFilters(); renderMatches(); }

function countdownHTML(matchId) {
  return '<div class="countdown" id="cd-' + matchId + '">' +
    '<div class="cd-box"><div class="cd-num" id="cd-d-' + matchId + '">0</div><div class="cd-label">يوم</div></div>' +
    '<div class="cd-sep">:</div>' +
    '<div class="cd-box"><div class="cd-num" id="cd-h-' + matchId + '">0</div><div class="cd-label">ساعة</div></div>' +
    '<div class="cd-sep">:</div>' +
    '<div class="cd-box"><div class="cd-num" id="cd-m-' + matchId + '">0</div><div class="cd-label">دقيقة</div></div>' +
    '<div class="cd-sep">:</div>' +
    '<div class="cd-box"><div class="cd-num" id="cd-s-' + matchId + '">0</div><div class="cd-label">ثانية</div></div>' +
    '</div>';
}
function updateAllCountdowns() {
  var filtered = getFilteredMatches(currentFilter);
  filtered.forEach(function(m, idx) {
    var el = document.getElementById('cd-' + idx);
    if (!el) return;
    var diff = new Date(m.date).getTime() - Date.now();
    var dEl = document.getElementById('cd-d-' + idx);
    var hEl = document.getElementById('cd-h-' + idx);
    var mEl = document.getElementById('cd-m-' + idx);
    var sEl = document.getElementById('cd-s-' + idx);
    if (!dEl) return;
    if (diff <= 0) { dEl.textContent = hEl.textContent = mEl.textContent = sEl.textContent = '0'; return; }
    var totalSec = Math.floor(diff / 1000);
    dEl.textContent = Math.floor(totalSec / 86400);
    var hh = Math.floor((totalSec % 86400) / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;
    hEl.textContent = hh < 10 ? '0' + hh : hh;
    mEl.textContent = mm < 10 ? '0' + mm : mm;
    sEl.textContent = ss < 10 ? '0' + ss : ss;
  });
}

function renderMatches() {
  var filtered = getFilteredMatches(currentFilter);
  var rd = document.getElementById('resultsData');
  if (filtered.length === 0) {
    rd.innerHTML = '<div class="empty">لا توجد مباريات في هذه الفئة.</div>';
    return;
  }
  var rhtml = '';
  filtered.forEach(function(m, idx) {
    var state = getMatchState(m);
    var headerStatus, statusClass, centerHtml, cardClass = 'match-card';
    if (state === 'finished') {
      statusClass = 'match-status finished'; headerStatus = '✅ انتهت';
      centerHtml = '<div class="match-score">' + m.hs + ' - ' + m.as + '</div>';
    } else if (state === 'halftime') {
      statusClass = 'match-status live'; headerStatus = '⏸️ بين الشوطين';
      centerHtml = '<div class="match-score live-score">' + m.hs + ' - ' + m.as + '</div>';
      cardClass += ' live';
    } else if (state === 'live' || state === 'live-auto') {
      statusClass = 'match-status live';
      var clock = m.clock ? " - د" + m.clock : '';
      headerStatus = state === 'live-auto' ? '🔴 مباشر (تقديري)' : '🔴 مباشر الآن' + clock;
      centerHtml = '<div class="match-score live-score">' + m.hs + ' - ' + m.as + '</div>';
      cardClass += ' live';
    } else {
      statusClass = 'match-status'; headerStatus = '⏱️ ' + formatMatchTime(m.date);
      centerHtml = countdownHTML(idx);
    }
    rhtml += '<div class="' + cardClass + '">';
    rhtml += '<div class="match-header"><div>' + formatMatchDate(m.date) + '</div><div class="' + statusClass + '">' + headerStatus + '</div></div>';
    rhtml += '<div class="match-body"><div class="match-team">' + m.home + '</div><div class="match-center">' + centerHtml + '</div><div class="match-team">' + m.away + '</div></div>';
    rhtml += '</div>';
  });
  rd.innerHTML = rhtml;
  updateAllCountdowns();
}

function filterPlayers() {
  var search = document.getElementById('playerSearch').value.toLowerCase().trim();
  var team = document.getElementById('teamFilter').value;
  var pos = document.getElementById('posFilter').value;
  var filtered = allPlayers.filter(function(p) {
    var nameAr = translateName(p.name).toLowerCase();
    if (search && p.name.toLowerCase().indexOf(search) === -1 && nameAr.indexOf(search) === -1) return false;
    if (team && p.team !== team) return false;
    if (pos && posName(p.position) !== pos) return false;
    return true;
  });
  renderPlayers(filtered);
}
function renderPlayers(players) {
  var tb = document.getElementById('playersBody');
  if (players.length === 0) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">لا يوجد لاعبون مطابقون للبحث.</td></tr>';
    document.getElementById('playerCount').textContent = '';
    return;
  }
  var html = '';
  players.forEach(function(p) {
    var posClass = posName(p.position);
    html += '<tr><td><span class="number-badge">' + (p.number || '—') + '</span></td>';
    html += '<td class="player-name-cell">' + translateName(p.name) + '</td>';
    html += '<td>' + p.team + '</td>';
    html += '<td><span class="pos-badge ' + posClass + '">' + posArabic(p.position) + '</span></td>';
    html += '<td>' + (p.age || '—') + '</td>';
    html += '<td>' + translateCountry(p.nationality) + '</td></tr>';
  });
  tb.innerHTML = html;
  document.getElementById('playerCount').textContent = 'عدد اللاعبين: ' + players.length + ' من ' + allPlayers.length;
}

function loadData(showLoader) {
  if (showLoader) {
    document.getElementById('standingsBody').innerHTML = '<tr><td colspan="10" class="loading">جاري التحميل...</td></tr>';
  }
  fetch('data.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var html = '';
      data.standings.forEach(function(t) {
        html += '<tr><td>' + t.r + '</td><td class="team">' + t.t + '</td><td>' + t.p + '</td><td>' + t.w + '</td><td>' + t.d + '</td><td>' + t.l + '</td><td>' + t.gf + '</td><td>' + t.ga + '</td><td>' + t.gd + '</td><td><b>' + t.pts + '</b></td></tr>';
      });
      document.getElementById('standingsBody').innerHTML = html;
      document.getElementById('updatedStandings').textContent = 'آخر تحديث: ' + data.lastUpdated;
      originalStandings = data.standings || [];

      allPlayers = (data.players || []).slice().sort(function(a, b) {
        if (a.team !== b.team) return a.team.localeCompare(b.team, 'ar');
        return parseInt(a.number || 999) - parseInt(b.number || 999);
      });
      if (allPlayers.length === 0) {
        document.getElementById('playersBody').innerHTML = '<tr><td colspan="6" class="empty">لم يتم جلب اللاعبين بعد.</td></tr>';
      } else {
        var teams = {};
        allPlayers.forEach(function(p) { if (p.team) teams[p.team] = true; });
        var teamSelect = document.getElementById('teamFilter');
        teamSelect.innerHTML = '<option value="">كل الفرق</option>';
        Object.keys(teams).sort(function(a,b){return a.localeCompare(b,'ar');}).forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t; opt.textContent = t;
          teamSelect.appendChild(opt);
        });
        renderPlayers(allPlayers);
      }

      allMatches = data.results || [];
      buildFilters();
      renderMatches();
      renderLiveStandings();

      var hasLive = getFilteredMatches('live').length > 0;
      var liveTab = document.getElementById('tabLive');
      if (hasLive) {
        liveTab.style.display = 'block';
      } else {
        liveTab.style.display = 'none';
        if (!document.getElementById('live').classList.contains('hidden')) {
          showTab('standings', document.getElementById('tabStandings'));
        }
      }

      secondsSinceRefresh = 0;
    })
    .catch(function(e) {
      document.getElementById('standingsBody').innerHTML = '<tr><td colspan="10" class="loading">تعذر التحميل</td></tr>';
    });
}

loadData(true);
setInterval(function() {
  secondsSinceRefresh++;
  if (secondsSinceRefresh >= REFRESH_INTERVAL) loadData(false);
}, 1000);
setInterval(updateAllCountdowns, 1000);
setInterval(function() {
  if (!document.getElementById('live').classList.contains('hidden')) renderLiveStandings();
}, 5000);
</script>
