<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدوري السعودي - إحصائيات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
  h1 { text-align: center; margin-bottom: 25px; color: #1a5490; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 8px; border-radius: 10px; }
  .tab { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-size: 16px; font-weight: bold; color: #555; border-radius: 8px; font-family: inherit; }
  .tab.active { background: #1a5490; color: white; }
  .content { background: white; padding: 20px; border-radius: 10px; }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #1a5490; color: white; padding: 12px; font-size: 14px; }
  td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
  .team { text-align: right; font-weight: bold; }
  .loading { text-align: center; color: #1a5490; padding: 40px; }
  .match { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
  .match-team { flex: 1; font-weight: bold; }
  .match-team.home { text-align: left; }
  .match-team.away { text-align: right; }
  .score { background: #1a5490; color: white; padding: 8px 18px; border-radius: 6px; font-weight: bold; font-size: 18px; margin: 0 15px; min-width: 70px; text-align: center; }
  .match-date { text-align: center; color: #888; font-size: 12px; padding: 5px; }
  .updated { text-align: center; color: #888; font-size: 12px; margin-top: 15px; }
  .empty { text-align: center; color: #888; padding: 40px; }
</style>
</head>
<body>

<h1>⚽ الدوري السعودي للمحترفين</h1>

<div class="tabs">
  <button class="tab active" onclick="showTab('standings', this)">الترتيب</button>
  <button class="tab" onclick="showTab('results', this)">النتائج</button>
</div>

<div id="standings" class="content">
  <table>
    <thead>
      <tr>
        <th>#</th><th>الفريق</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th>
        <th>له</th><th>عليه</th><th>الفرق</th><th>النقاط</th>
      </tr>
    </thead>
    <tbody id="standingsBody">
      <tr><td colspan="10" class="loading">جاري التحميل...</td></tr>
    </tbody>
  </table>
  <div id="updatedStandings" class="updated"></div>
</div>

<div id="results" class="content hidden">
  <div id="resultsData" class="loading">جاري التحميل...</div>
</div>

<script>
function showTab(id, btn) {
  document.querySelectorAll('.content').forEach(function(el) { el.classList.add('hidden'); });
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById(id).classList.remove('hidden');
  btn.classList.add('active');
}

fetch('data.json?v=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(data) {
    // الترتيب
    var html = '';
    data.standings.forEach(function(t) {
      html += '<tr>';
      html += '<td>' + t.r + '</td>';
      html += '<td class="team">' + t.t + '</td>';
      html += '<td>' + t.p + '</td>';
      html += '<td>' + t.w + '</td>';
      html += '<td>' + t.d + '</td>';
      html += '<td>' + t.l + '</td>';
      html += '<td>' + t.gf + '</td>';
      html += '<td>' + t.ga + '</td>';
      html += '<td>' + t.gd + '</td>';
      html += '<td><b>' + t.pts + '</b></td>';
      html += '</tr>';
    });
    document.getElementById('standingsBody').innerHTML = html;
    document.getElementById('updatedStandings').textContent = 'آخر تحديث: ' + data.lastUpdated;

    // النتائج
    var rd = document.getElementById('resultsData');
    if (!data.results || data.results.length === 0) {
      rd.innerHTML = '<div class="empty">لا توجد مباريات حديثة. سيتم التحديث تلقائياً.</div>';
    } else {
      var rhtml = '';
      data.results.forEach(function(m) {
        var d = new Date(m.date);
        var ds = d.toLocaleDateString('ar-SA', { weekday: 'long', day: 'numeric', month: 'long' });
        rhtml += '<div>';
        rhtml += '<div class="match-date">' + ds + ' — ' + m.status + '</div>';
        rhtml += '<div class="match">';
        rhtml += '<div class="match-team home">' + m.home + '</div>';
        rhtml += '<div class="score">' + m.hs + ' - ' + m.as + '</div>';
        rhtml += '<div class="match-team away">' + m.away + '</div>';
        rhtml += '</div></div>';
      });
      rd.innerHTML = rhtml;
    }
  })
  .catch(function(e) {
    document.getElementById('standingsBody').innerHTML = '<tr><td colspan="10" class="loading">تعذر التحميل</td></tr>';
  });
</script>

</body>
</html>
