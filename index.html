<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدوري السعودي - إحصائيات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif; background: #f0f2f5; padding: 0 15px 15px; color: #333; }

  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #f0f2f5;
    padding: 15px 0 10px;
    margin: 0 -15px;
    padding-left: 15px;
    padding-right: 15px;
    box-shadow: 0 4px 8px -2px rgba(0,0,0,0.05);
  }

  h1 { text-align: center; margin-bottom: 15px; color: #1a5490; font-size: 22px; }
  .tabs-wrap { overflow-x: auto; margin-bottom: 0; border-radius: 10px; }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tabs { display: flex; gap: 6px; background: white; padding: 6px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-width: max-content; }
  .tab { padding: 10px 16px; border: none; background: transparent; cursor: pointer; font-size: 14px; font-weight: bold; color: #555; border-radius: 8px; font-family: inherit; white-space: nowrap; }
  .tab.active { background: #1a5490; color: white; }
  .tab.active-live { background: #c0392b; color: white; }

  .content { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 15px; }
  .hidden { display: none; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { background: #1a5490; color: white; padding: 10px 8px; text-align: center; font-size: 13px; white-space: nowrap; }
  td { padding: 8px; text-align: center; border-bottom: 1px solid #eee; font-size: 13px; }
  .team { text-align: right; font-weight: bold; }
  .team-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; transition: 0.2s; }

  .team-link {
    display: flex; align-items: center; gap: 8px; justify-content: flex-end;
    text-decoration: none; color: #1a5490; font-weight: bold;
    padding: 4px 6px; border-radius: 6px; transition: 0.2s; cursor: pointer;
    border: none; background: transparent; font-family: inherit; font-size: 13px;
  }
  .team-link:hover { background: #e8f4fd; color: #c0392b; }
  .team-link:hover .team-logo { transform: scale(1.1); }
  .team-link::after { content: 'ℹ️'; font-size: 12px; opacity: 0.4; }
  .team-link:hover::after { opacity: 1; }

  tr:hover { background: #f8f9fa; }
  tr.live-team { background: #fff5f5; }
  .loading, .empty { text-align: center; color: #888; padding: 40px; font-size: 15px; }
  .search-bar { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search-bar input, .search-bar select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; flex: 1; min-width: 120px; }
  .match-filters { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .filter-btn { padding: 8px 14px; border: 2px solid #e0e0e0; background: white; border-radius: 25px; cursor: pointer; font-size: 13px; font-weight: bold; color: #555; font-family: inherit; }
  .filter-btn.active { background: #1a5490; color: white; border-color: #1a5490; }
  .filter-btn .count { display: inline-block; background: rgba(255,255,255,0.25); padding: 1px 8px; border-radius: 10px; margin-right: 5px; font-size: 11px; }
  .filter-btn:not(.active) .count { background: #f0f2f5; color: #666; }
  .match-card { border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .match-card.live { border-color: #c0392b; border-width: 2px; }
  .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: #666; gap: 8px; flex-wrap: wrap; }
  .match-status { background: #e8f4fd; color: #1a5490; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .match-status.live { background: #fee; color: #c0392b; }
  .match-status.finished { background: #e8f8e8; color: #27ae60; }
  .match-body { display: flex; justify-content: center; align-items: center; gap: 15px; }
  .match-team-block { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 90px; cursor: pointer; padding: 5px; border-radius: 8px; transition: 0.2s; border: none; background: transparent; font-family: inherit; }
  .match-team-block:hover { background: #e8f4fd; }
  .match-team-logo { width: 55px; height: 55px; object-fit: contain; transition: 0.2s; }
  .match-team-block:hover .match-team-logo { transform: scale(1.1); }
  .match-team { font-weight: bold; font-size: 14px; text-align: center; color: #1a5490; }
  .match-team-block:hover .match-team { color: #c0392b; }
  .match-center { min-width: 140px; text-align: center; }
  .match-score { background: #1a5490; color: white; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 20px; display: inline-block; }
  .match-score.live-score { background: #c0392b; }
  .countdown { display: flex; justify-content: center; align-items: center; gap: 4px; direction: ltr; }
  .cd-box { background: linear-gradient(135deg, #1a5490, #2c6db5); color: white; padding: 6px 8px; border-radius: 6px; min-width: 42px; text-align: center; }
  .cd-num { font-size: 16px; font-weight: bold; line-height: 1; }
  .cd-label { font-size: 9px; opacity: 0.85; margin-top: 2px; }
  .cd-sep { color: #1a5490; font-size: 16px; font-weight: bold; padding: 0 1px; }
  .updated { text-align: center; color: #888; font-size: 11px; margin-top: 12px; }
  .pos-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
  .pos-badge.GK { background: #fff4e0; color: #b8860b; }
  .pos-badge.DF { background: #e8f8e8; color: #27ae60; }
  .pos-badge.MF { background: #e8f4fd; color: #1a5490; }
  .pos-badge.FW { background: #fdeaea; color: #c0392b; }
  .number-badge { display: inline-flex; align-items: center; justify-content: center; background: #1a5490; color: white; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; font-size: 12px; padding: 0; line-height: 1; }
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #e8f4fd; color: #1a5490; font-weight: bold; font-size: 12px; padding: 0; line-height: 1; }
  .rank-badge.gold { background: #ffd700; color: #333; }
  .rank-badge.silver { background: #c0c0c0; color: #333; }
  .rank-badge.bronze { background: #cd7f32; color: white; }
  .change-up { color: #27ae60; font-weight: bold; }
  .change-down { color: #c0392b; font-weight: bold; }
  .live-banner { background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; padding: 12px; border-radius: 10px; margin-bottom: 12px; text-align: center; font-weight: bold; font-size: 14px; }
  .live-banner .live-dot { display: inline-block; width: 8px; height: 8px; background: white; border-radius: 50%; margin-right: 8px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .live-info { text-align: center; font-size: 12px; color: #666; margin-bottom: 12px; padding: 10px; background: #fef9e7; border-radius: 6px; line-height: 1.6; }

  .player-name-cell {
    color: #1a5490;
    font-weight: bold;
    font-size: 13px;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    padding: 15px; opacity: 0; visibility: hidden; transition: 0.3s;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal-content {
    background: white; border-radius: 15px; max-width: 700px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    transform: scale(0.9); transition: 0.3s; position: relative;
  }
  .modal-overlay.open .modal-content { transform: scale(1); }
  .modal-close {
    position: absolute; top: 12px; left: 12px;
    background: #c0392b; color: white; border: none; border-radius: 50%;
    width: 36px; height: 36px; font-size: 20px; cursor: pointer;
    z-index: 10; line-height: 1; transition: 0.2s;
  }
  .modal-close:hover { background: #a93226; transform: rotate(90deg); }
  .modal-header {
    background: linear-gradient(135deg, #1a5490, #2c6db5);
    color: white; padding: 25px 20px; text-align: center;
    border-radius: 15px 15px 0 0;
  }
  .modal-header .team-logo-big {
    width: 100px; height: 100px; object-fit: contain;
    margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }
  .modal-header h2 { font-size: 26px; margin-bottom: 5px; }
  .modal-header .subtitle { font-size: 13px; opacity: 0.9; }
  .modal-body { padding: 20px; }
  .modal-section { margin-bottom: 25px; }
  .modal-section-title {
    font-size: 16px; font-weight: bold; color: #1a5490;
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 2px solid #e8f4fd;
    display: flex; align-items: center; gap: 8px;
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
  }
  .stat-card {
    background: #f8f9fa; border-radius: 10px; padding: 12px;
    text-align: center; border: 1px solid #eee;
  }
  .stat-card .stat-value { font-size: 24px; font-weight: bold; color: #1a5490; line-height: 1; }
  .stat-card .stat-label { font-size: 11px; color: #666; margin-top: 5px; }
  .stat-card.gold { background: #fff9e0; border-color: #ffd700; }
  .stat-card.gold .stat-value { color: #b8860b; }

  .players-mini-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }
  .player-mini {
    background: #f8f9fa; border-radius: 8px; padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; border: 1px solid #eee;
  }
  .player-mini .num {
    background: #1a5490; color: white; width: 24px; height: 24px;
    border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 11px; flex-shrink: 0;
  }
  .player-mini .name {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: #333;
  }
  .player-mini .pos-tag { font-size: 10px; padding: 2px 5px; border-radius: 4px; background: #e8f4fd; color: #1a5490; }

  .match-mini {
    display: flex; align-items: center; gap: 8px;
    background: #f8f9fa; border-radius: 8px; padding: 8px;
    margin-bottom: 6px; font-size: 12px; border: 1px solid #eee;
  }
  .match-mini .date { font-size: 10px; color: #666; min-width: 70px; }
  .match-mini .team { font-weight: bold; flex: 1; text-align: center; }
  .match-mini .score { background: #1a5490; color: white; padding: 3px 8px; border-radius: 5px; font-weight: bold; min-width: 40px; text-align: center; }
  .match-mini .score.live { background: #c0392b; }
  .match-mini .score.upcoming { background: #e8f4fd; color: #1a5490; font-size: 10px; }

  @media (max-width: 600px) {
    body { padding: 0 8px 8px; }
    .sticky-header { padding: 10px 8px 8px; margin: 0 -8px; }
    h1 { font-size: 17px; margin-bottom: 10px; }
    .content { padding: 8px; margin-top: 10px; }
    .tab { padding: 8px 12px; font-size: 13px; }

    #standings .table-wrap { overflow-x: auto; }
    #standings table { min-width: 100%; font-size: 11px; }
    #standings th, #standings td { padding: 6px 3px; font-size: 11px; }
    #standings th:nth-child(3), #standings td:nth-child(3),
    #standings th:nth-child(7), #standings td:nth-child(7),
    #standings th:nth-child(8), #standings td:nth-child(8) { display: none; }
    #standings .team { font-size: 12px; }
    #standings .rank-badge { width: 20px; height: 20px; font-size: 11px; }
    #standings .team-logo { width: 22px; height: 22px; }
    .team-link { gap: 4px; padding: 2px 4px; font-size: 12px; }
    .team-link::after { font-size: 10px; }

    /* ====== اللاعبون على الجوال: سطر مضغوط ====== */
    #players table { min-width: 100%; }
    #players thead { display: none; }
    #players tbody tr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-bottom: 1px solid #f0f0f0;
      padding: 8px 4px;
      font-size: 12px;
      gap: 6px;
    }
    #players tbody tr:last-child { border-bottom: none; }
    #players tbody td {
      display: inline-block;
      padding: 0;
      border: none;
      text-align: right;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #players tbody td::before { content: none; }
    #players tbody td:nth-child(1) { flex-shrink: 0; width: auto; }
    #players tbody td:nth-child(2) {
      flex: 1;
      text-align: right;
      font-weight: bold;
      color: #1a5490;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #players tbody td:nth-child(3) {
      flex-shrink: 0;
      font-size: 11px;
      color: #666;
      padding-right: 6px;
    }
    #players tbody td:nth-child(4) { flex-shrink: 0; }
    #players tbody td:nth-child(5) {
      display: none;
    }
    #players tbody td:nth-child(6) {
      display: none;
    }
    #players .number-badge { width: 24px; height: 24px; font-size: 11px; }
    #players .pos-badge { font-size: 10px; padding: 2px 6px; }

    .match-filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .match-filters::-webkit-scrollbar { display: none; }
    .filter-btn { white-space: nowrap; padding: 8px 12px; font-size: 12px; flex-shrink: 0; }

    .match-card { padding: 10px 8px; margin-bottom: 8px; }
    .match-header { margin-bottom: 10px; font-size: 11px; }
    .match-status { font-size: 10px; padding: 2px 6px; }

    .match-body {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-template-rows: auto auto !important;
      gap: 10px 8px !important;
      justify-content: center;
      align-items: center;
    }
    .match-team-block:nth-child(1) { grid-column: 1; grid-row: 1; }
    .match-team-block:nth-child(3) { grid-column: 2; grid-row: 1; }
    .match-center { grid-column: 1 / -1; grid-row: 2; min-width: auto; max-width: 100%; padding-top: 4px; }
    .match-team-logo { width: 45px; height: 45px; }
    .match-team { font-size: 12px; }
    .match-score { font-size: 18px; padding: 8px 14px; }

    .countdown { display: flex !important; flex-wrap: nowrap !important; gap: 3px !important; justify-content: center !important; direction: ltr !important; }
    .cd-box { min-width: 38px !important; padding: 5px 4px !important; border-radius: 6px !important; }
    .cd-num { font-size: 14px !important; font-weight: bold !important; line-height: 1 !important; }
    .cd-label { font-size: 8px !important; margin-top: 2px !important; opacity: 0.85 !important; }
    .cd-sep { font-size: 13px !important; font-weight: bold !important; padding: 0 !important; }

    .modal-content { max-height: 95vh; border-radius: 12px; }
    .modal-header { padding: 20px 15px; }
    .modal-header .team-logo-big { width: 75px; height: 75px; }
    .modal-header h2 { font-size: 20px; }
    .modal-body { padding: 15px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-card { padding: 8px; }
    .stat-card .stat-value { font-size: 18px; }
    .stat-card .stat-label { font-size: 10px; }
    .players-mini-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
    .player-mini { padding: 6px 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>⚽ الدوري السعودي للمحترفين</h1>
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" onclick="showTab('standings', this)" id="tabStandings">الترتيب</button>
      <button class="tab" onclick="showTab('live', this)" id="tabLive" style="display:none;">🔴 ترتيب حي</button>
      <button class="tab" onclick="showTab('players', this)">اللاعبون</button>
      <button class="tab" onclick="showTab('results', this)">المباريات</button>
    </div>
  </div>
</div>

<div id="standings" class="content">
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th><th>له</th><th>عليه</th><th>الفرق</th><th>النقاط</th></tr></thead>
    <tbody id="standingsBody"><tr><td colspan="10" class="loading">جاري التحميل...</td></tr></tbody>
  </table></div>
  <div id="updatedStandings" class="updated"></div>
</div>

<div id="live" class="content hidden">
  <div class="live-banner"><span class="live-dot"></span> الترتيب الحي أثناء المباريات</div>
  <div id="liveMatchesInfo" class="live-info"></div>
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th><th>له</th><th>عليه</th><th>الفرق</th><th>النقاط</th></tr></thead>
    <tbody id="liveBody"></tbody>
  </table></div>
  <div class="updated">⚠️ ترتيب افتراضي ومؤقت.</div>
</div>

<div id="players" class="content hidden">
  <div class="search-bar">
    <input type="text" id="playerSearch" placeholder="ابحث باسم اللاعب..." oninput="filterPlayers()">
    <select id="teamFilter" onchange="filterPlayers()"><option value="">كل الفرق</option></select>
    <select id="posFilter" onchange="filterPlayers()">
      <option value="">كل المراكز</option>
      <option value="GK">حراس المرمى</option>
      <option value="DF">المدافعون</option>
      <option value="MF">لاعبو الوسط</option>
      <option value="FW">المهاجمون</option>
    </select>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>اللاعب</th><th>الفريق</th><th>المركز</th><th>العمر</th><th>الجنسية</th></tr></thead>
    <tbody id="playersBody"><tr><td colspan="6" class="loading">جاري التحميل...</td></tr></tbody>
  </table></div>
  <div id="playerCount" class="updated"></div>
</div>

<div id="results" class="content hidden">
  <div class="match-filters" id="matchFilters"></div>
  <div id="resultsData" class="loading">جاري التحميل...</div>
</div>

<div class="modal-overlay" id="teamModal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalInnerContent"></div>
  </div>
</div>

<script src="names.js"></script>
<script>
var teamLogos = {
  "الهلال": "https://a.espncdn.com/i/teamlogos/soccer/500/929.png",

  "الخلود": "https://a.espncdn.com/i/teamlogos/soccer/500/22028.png",
  "الدرعية": "https://a.espncdn.com/i/teamlogos/soccer/500/131746.png",
  "الاتفاق": "https://a.espncdn.com/i/teamlogos/soccer/500/8363.png",
  "الحزم": "https://a.espncdn.com/i/teamlogos/soccer/500/21964.png",
  "الرياض": "https://a.espncdn.com/i/teamlogos/soccer/500/21965.png",
  "الفيحاء": "https://a.espncdn.com/i/teamlogos/soccer/500/21827.png",

  "الفيصلي": "https://a.espncdn.com/i/teamlogos/soccer/500/21446.png",
  "التعاون": "https://a.espncdn.com/i/teamlogos/soccer/500/18459.png",
  "أبها": "https://a.espncdn.com/i/teamlogos/soccer/500/21833.png"
};

var countryMap = {
  "Saudi Arabia":"السعودية","Portugal":"البرتغال","Brazil":"البرازيل","France":"فرنسا",
  "Argentina":"الأرجنتين","Spain":"إسبانيا","Germany":"ألمانيا","Italy":"إيطاليا",

function translateName(name) {
  if (!name) return '';
  if (window.translatePlayer) return window.translatePlayer(name);
  return name;
}

function translateCountry(c) {
  if (!c) return '—';
  if (countryMap[c]) return countryMap[c];
  for (var k in countryMap) if (k.toLowerCase() === c.toLowerCase()) return countryMap[k];
  return c;
}

function formatMatchDate(iso) {
  var d = new Date(iso);
  var days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return days[d.getDay()] + '، ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function formatMatchTime(iso) {
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'مساءً' : 'صباحاً';
  h = h % 12; if (h === 0) h = 12;
  var mm = m < 10 ? '0' + m : m;
  return h + ':' + mm + ' ' + ampm;
}
function posName(a) {
  if (a === 'GK' || a === 'G') return 'GK';
  if (['DF','D','CB','LB','RB'].indexOf(a) !== -1) return 'DF';
  if (['MF','M','CM','DM','AM'].indexOf(a) !== -1) return 'MF';
  if (['FW','F','ST','CF','LW','RW'].indexOf(a) !== -1) return 'FW';
  return a;
}
function posArabic(a) {
  var p = posName(a);
  return p === 'GK' ? 'حارس' : p === 'DF' ? 'مدافع' : p === 'MF' ? 'وسط' : p === 'FW' ? 'مهاجم' : (a || '—');
}

var allMatches = [];
var allPlayers = [];
var originalStandings = [];
var currentFilter = 'all';
var previousRanks = {};
var secondsSinceRefresh = 0;
var REFRESH_INTERVAL = 180;

function getMatchState(m) {
  var status = (m.status || '').toLowerCase();
  var state = (m.state || '').toLowerCase();
  var diffMin = (Date.now() - new Date(m.date).getTime()) / 60000;
  if (m.completed || state === 'post' || status === 'ft' || status.indexOf('final') !== -1 || status.indexOf('full time') !== -1) return 'finished';
  if (status === 'ht' || status.indexOf('half time') !== -1 || status.indexOf('halftime') !== -1) return 'halftime';
  if (state === 'in' || status.indexOf('progress') !== -1 || /^\d+'/.test(status) || status.indexOf("'") !== -1) return 'live';
  if (diffMin < 0) return 'upcoming';
  if (diffMin < 105) return 'live-auto';
  if (diffMin >= 105 && diffMin < 135) return 'halftime';
  return 'finished';
}

function getDateCategory(dateIso) {
  var d = new Date(dateIso);
  var today = new Date(); today.setHours(0,0,0,0);
  var tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  var dayAfter = new Date(today); dayAfter.setDate(today.getDate() + 2);
  var yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  var weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
  var weekAhead = new Date(today); weekAhead.setDate(today.getDate() + 7);
  if (d >= today && d < tomorrow) return 'today';
  if (d >= tomorrow && d < dayAfter) return 'tomorrow';
  if (d >= yesterday && d < today) return 'yesterday';
  if (d >= weekAgo && d < yesterday) return 'lastweek';
  if (d >= dayAfter && d < weekAhead) return 'nextweek';
  return 'other';
}

function isLiveState(state) {
  return state === 'live' || state === 'live-auto' || state === 'halftime';
}

function getFilteredMatches(filter) {
  return allMatches.filter(function(m) {
    var state = getMatchState(m);
    var cat = getDateCategory(m.date);
    if (filter === 'all') return true;
    if (filter === 'live') return isLiveState(state);
    if (filter === 'today') return cat === 'today';
    if (filter === 'tomorrow') return cat === 'tomorrow';
    if (filter === 'yesterday') return cat === 'yesterday';
    if (filter === 'nextweek') return cat === 'nextweek';
    return true;
  }).sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
}

function computeLiveStandings() {
  var table = originalStandings.map(function(t) {
    return { t: t.t, p: parseInt(t.p)||0, w: parseInt(t.w)||0, d: parseInt(t.d)||0,
             l: parseInt(t.l)||0, gf: parseInt(t.gf)||0, ga: parseInt(t.ga)||0,
             pts: parseInt(t.pts)||0, live: false };
  });
  var liveMatches = [];
  allMatches.forEach(function(m) {
    if (isLiveState(getMatchState(m))) {
      liveMatches.push(m);
      var hs = parseInt(m.hs) || 0, as = parseInt(m.as) || 0;
      var home = table.find(function(t) { return t.t === m.home; });
      var away = table.find(function(t) { return t.t === m.away; });
      if (home && away) {
        home.live = true; away.live = true;
        home.p++; away.p++;
        home.gf += hs; home.ga += as;
        away.gf += as; away.ga += hs;
        if (hs > as) { home.w++; home.pts += 3; away.l++; }
        else if (as > hs) { away.w++; away.pts += 3; home.l++; }
        else { home.d++; home.pts++; away.d++; away.pts++; }
      }
    }
  });
  table.sort(function(a, b) {
    if (b.pts !== a.pts) return b.pts - a.pts;
    var gdA = a.gf - a.ga, gdB = b.gf - b.ga;
    if (gdB !== gdA) return gdB - gdA;
    return b.gf - a.gf;
  });
  table.forEach(function(t, i) { t.r = i + 1; });
  return { table: table, liveMatches: liveMatches };
}

function renderLiveStandings() {
  var result = computeLiveStandings();
  var table = result.table;
  var liveMatches = result.liveMatches;
  var info = document.getElementById('liveMatchesInfo');
  if (liveMatches.length === 0) {
    info.innerHTML = 'لا توجد مباريات جارية حالياً.';
  } else {
    var mhtml = '<b>' + liveMatches.length + ' مباراة جارية الآن:</b><br>';
    liveMatches.forEach(function(m) {
      mhtml += '⚽ ' + m.home + ' <b>' + m.hs + ' - ' + m.as + '</b> ' + m.away + '<br>';
    });
    info.innerHTML = mhtml;
  }
  var html = '';
  table.forEach(function(t) {
    var prev = previousRanks[t.t];
    var changeHtml = '';
    if (prev !== undefined && prev !== t.r) {
      var diff = prev - t.r;
      if (diff > 0) changeHtml = '<span class="change-up"> ▲</span>';
      else changeHtml = '<span class="change-down"> ▼</span>';
    }
    var rowClass = t.live ? 'live-team' : '';
    var rankClass = 'rank-badge';
    if (t.r === 1) rankClass += ' gold';
    else if (t.r === 2) rankClass += ' silver';
    else if (t.r === 3) rankClass += ' bronze';
    var gd = t.gf - t.ga;
    var gdStr = (gd > 0 ? '+' : '') + gd;
    html += '<tr class="' + rowClass + '">';
    html += '<td data-label="#"><span class="' + rankClass + '">' + t.r + '</span>' + changeHtml + '</td>';
    html += '<td data-label="الفريق" class="team">' + teamLinkHTML(t.t, true) + (t.live ? ' ⚽' : '') + '</td>';
    html += '<td data-label="لعب">' + t.p + '</td>';
    html += '<td data-label="فاز">' + t.w + '</td>';
    html += '<td data-label="تعادل">' + t.d + '</td>';
    html += '<td data-label="خسر">' + t.l + '</td>';
    html += '<td data-label="له">' + t.gf + '</td>';
    html += '<td data-label="عليه">' + t.ga + '</td>';
    html += '<td data-label="الفرق">' + gdStr + '</td>';
    html += '<td data-label="النقاط"><b>' + t.pts + '</b></td></tr>';
  });
  document.getElementById('liveBody').innerHTML = html;
  previousRanks = {};
  table.forEach(function(t) { previousRanks[t.t] = t.r; });
}

function buildFilters() {
  var filters = [
    { id: 'all', label: '📋 الكل' },
    { id: 'live', label: '🔴 مباشر الآن' },
    { id: 'today', label: '📅 اليوم' },

  ];
  var html = '';
  filters.forEach(function(f) {
    var count = getFilteredMatches(f.id).length;

    html += '<button class="filter-btn ' + activeClass + '" onclick="setFilter(\'' + f.id + '\')">' + f.label + ' <span class="count">' + count + '</span></button>';

}

function countdownHTML(matchDate) {
  var safeId = matchDate.replace(/[^a-zA-Z0-9]/g, '');
  return '<div class="countdown" data-mdate="' + matchDate + '" id="cd-' + safeId + '"></div>';
}

function updateAllCountdowns() {
  var countdowns = document.querySelectorAll('.countdown');
  countdowns.forEach(function(el) {
    var mdate = el.getAttribute('data-mdate');
    if (!mdate) return;
    var diff = new Date(mdate).getTime() - Date.now();
    if (diff <= 0) { el.innerHTML = ''; return; }
    var totalSec = Math.floor(diff / 1000);
    var days = Math.floor(totalSec / 86400);
    var hours = Math.floor((totalSec % 86400) / 3600);
    var mins = Math.floor((totalSec % 3600) / 60);
    var secs = totalSec % 60;
    var html = '';
    if (totalSec < 3600) {
      html = '<div class="cd-box"><div class="cd-num">' + (mins<10?'0'+mins:mins) + '</div><div class="cd-label">دقيقة</div></div><div class="cd-sep">:</div><div class="cd-box"><div class="cd-num">' + (secs<10?'0'+secs:secs) + '</div><div class="cd-label">ثانية</div></div>';
    } else if (totalSec < 86400) {
      html = '<div class="cd-box"><div class="cd-num">' + hours + '</div><div class="cd-label">ساعة</div></div><div class="cd-sep">:</div><div class="cd-box"><div class="cd-num">' + (mins<10?'0'+mins:mins) + '</div><div class="cd-label">دقيقة</div></div><div class="cd-sep">:</div><div class="cd-box"><div class="cd-num">' + (secs<10?'0'+secs:secs) + '</div><div class="cd-label">ثانية</div></div>';
    } else {
      html = '<div class="cd-box"><div class="cd-num">' + days + '</div><div class="cd-label">' + (days===1?'يوم':'أيام') + '</div></div><div class="cd-sep">:</div><div class="cd-box"><div class="cd-num">' + (hours<10?'0'+hours:hours) + '</div><div class="cd-label">ساعة</div></div><div class="cd-sep">:</div><div class="cd-box"><div class="cd-num">' + (mins<10?'0'+mins:mins) + '</div><div class="cd-label">دقيقة</div></div><div class="cd-sep">:</div><div class="cd-box"><div class="cd-num">' + (secs<10?'0'+secs:secs) + '</div><div class="cd-label">ثانية</div></div>';
    }
    el.innerHTML = html;
  });
}

function renderMatches() {
  var filtered = getFilteredMatches(currentFilter);
  var rd = document.getElementById('resultsData');
  if (filtered.length === 0) {
    rd.innerHTML = '<div class="empty">لا توجد مباريات في هذه الفئة.</div>';
    return;
  }
  var rhtml = '';
  filtered.forEach(function(m) {
    var state = getMatchState(m);
    var headerStatus, statusClass, centerHtml, cardClass = 'match-card';
    if (state === 'finished') {
      statusClass = 'match-status finished'; headerStatus = '✅ انتهت';
      centerHtml = '<div class="match-score">' + m.hs + ' - ' + m.as + '</div>';
    } else if (state === 'halftime') {
      statusClass = 'match-status live'; headerStatus = '⏸️ بين الشوطين';
      centerHtml = '<div class="match-score live-score">' + m.hs + ' - ' + m.as + '</div>';
      cardClass += ' live';
    } else if (state === 'live' || state === 'live-auto') {
      statusClass = 'match-status live';
      var clock = m.clock ? " - د" + m.clock : '';
      headerStatus = state === 'live-auto' ? '🔴 مباشر (تقديري)' : '🔴 مباشر' + clock;
      centerHtml = '<div class="match-score live-score">' + m.hs + ' - ' + m.as + '</div>';
      cardClass += ' live';
    } else {
      statusClass = 'match-status'; headerStatus = '⏱️ ' + formatMatchTime(m.date);
      centerHtml = countdownHTML(m.date);
    }
    rhtml += '<div class="' + cardClass + '">';
    rhtml += '<div class="match-header"><div>' + formatMatchDate(m.date) + '</div><div class="' + statusClass + '">' + headerStatus + '</div></div>';
    rhtml += '<div class="match-body">';
    rhtml += teamMatchLinkHTML(m.home);
    rhtml += '<div class="match-center">' + centerHtml + '</div>';
    rhtml += teamMatchLinkHTML(m.away);
    rhtml += '</div></div>';
  });
  rd.innerHTML = rhtml;
  updateAllCountdowns();
}

function filterPlayers() {
  var search = document.getElementById('playerSearch').value.toLowerCase().trim();
  var team = document.getElementById('teamFilter').value;
  var pos = document.getElementById('posFilter').value;
  var filtered = allPlayers.filter(function(p) {
    var nameAr = translateName(p.name).toLowerCase();
    var nameEn = p.name.toLowerCase();
    if (search && nameEn.indexOf(search) === -1 && nameAr.indexOf(search) === -1) return false;
    if (team && p.team !== team) return false;
    if (pos && posName(p.position) !== pos) return false;
    return true;
  });
  renderPlayers(filtered);
}

    html += '<td data-label="اللاعب" class="team player-name-cell">' + translateName(p.name) + '</td>';
    html += '<td data-label="الفريق">' + p.team + '</td>';
    html += '<td data-label="المركز"><span class="pos-badge ' + posClass + '">' + posArabic(p.position) + '</span></td>';
    html += '<td data-label="العمر">' + (p.age || '—') + '</td>';
    html += '<td data-label="الجنسية">' + translateCountry(p.nationality) + '</td></tr>';
  });
  tb.innerHTML = html;
  document.getElementById('playerCount').textContent = 'عدد اللاعبين: ' + players.length + ' من ' + allPlayers.length;
}

function loadData(showLoader) {
  if (showLoader) {
    document.getElementById('standingsBody').innerHTML = '<tr><td colspan="10" class="loading">جاري التحميل...</td></tr>';
  }
  fetch('data.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var html = '';
      data.standings.forEach(function(t) {
        html += '<tr>';
        html += '<td data-label="#">' + t.r + '</td>';
        html += '<td data-label="الفريق" class="team">' + teamLinkHTML(t.t, true) + '</td>';
        html += '<td data-label="لعب">' + t.p + '</td>';
        html += '<td data-label="فاز">' + t.w + '</td>';
        html += '<td data-label="تعادل">' + t.d + '</td>';
        html += '<td data-label="خسر">' + t.l + '</td>';
        html += '<td data-label="له">' + t.gf + '</td>';
        html += '<td data-label="عليه">' + t.ga + '</td>';
        html += '<td data-label="الفرق">' + t.gd + '</td>';
        html += '<td data-label="النقاط"><b>' + t.pts + '</b></td></tr>';
      });
      document.getElementById('standingsBody').innerHTML = html;
      document.getElementById('updatedStandings').textContent = 'آخر تحديث: ' + data.lastUpdated;
      originalStandings = data.standings || [];

      allPlayers = (data.players || []).slice().sort(function(a, b) {
        if (a.team !== b.team) return a.team.localeCompare(b.team, 'ar');
        return parseInt(a.number || 999) - parseInt(b.number || 999);
      });
      if (allPlayers.length === 0) {
        document.getElementById('playersBody').innerHTML = '<tr><td colspan="6" class="empty">لم يتم جلب اللاعبين بعد.</td></tr>';
      } else {
        var teams = {};
        allPlayers.forEach(function(p) { if (p.team) teams[p.team] = true; });
        var teamSelect = document.getElementById('teamFilter');
        teamSelect.innerHTML = '<option value="">كل الفرق</option>';
        Object.keys(teams).sort(function(a,b){return a.localeCompare(b,'ar');}).forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t; opt.textContent = t;
          teamSelect.appendChild(opt);
        });
        renderPlayers(allPlayers);
      }

      allMatches = data.results || [];
      buildFilters();
      renderMatches();
      renderLiveStandings();

      var hasLive = getFilteredMatches('live').length > 0;
      var liveTab = document.getElementById('tabLive');
      if (hasLive) {
        liveTab.style.display = 'block';
      } else {
        liveTab.style.display = 'none';
        if (!document.getElementById('live').classList.contains('hidden')) {
          showTab('standings', document.getElementById('tabStandings'));
        }
      }

      secondsSinceRefresh = 0;
    })
    .catch(function(e) {
      document.getElementById('standingsBody').innerHTML = '<tr><td colspan="10" class="loading">تعذر التحميل</td></tr>';
    });
}

loadData(true);
setInterval(function() {
  secondsSinceRefresh++;
  if (secondsSinceRefresh >= REFRESH_INTERVAL) loadData(false);
}, 1000);
setInterval(updateAllCountdowns, 1000);
setInterval(function() {
  if (!document.getElementById('live').classList.contains('hidden')) renderLiveStandings();
}, 5000);
</script>
</body>
</html>
